name: Showcase

# Draws the README's menu bar pictures on a Mac from made-up accounts
# (make showcase-menu) and keeps them as an artifact. Run by hand, or by
# pushing to a docs/ branch that changes the menu.
on:
  workflow_dispatch:
  push:
    branches: ['docs/**']
    paths: ['build/macos/**', '.github/workflows/showcase.yml']

# Reads the repository and nothing else.
permissions:
  contents: read

jobs:
  menu:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Draw the menu
        run: make showcase-menu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menu-shots
          path: menu-shots
