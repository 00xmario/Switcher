name: Checks

on:
  push:
  pull_request:

# The checks read the repository and nothing else. Actions are pinned to
# commits, so a moved tag cannot change what runs here.
permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify
        run: make verify
      # The native Keychain writer, on a throwaway keychain of this runner.
      - name: Verify the native Keychain writer
        run: build/macos/keychain-test.sh

  verify-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify on Linux
        run: make verify-linux
