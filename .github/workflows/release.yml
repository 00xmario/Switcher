name: Release

on:
  push:
    tags:
      - 'v*'

# Only the release job may write, and only releases. Actions are pinned to
# commits, so a moved tag cannot change what builds a release.
permissions:
  contents: read

jobs:
  # The Go and web checks on Linux itself, where the tray, keep awake and
  # login service are native. The release waits for them.
  verify-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # A release is built only from a commit that is on main: a tag on any
      # other commit, such as a branch nobody reviewed, releases nothing.
      - name: Release only what is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "The tag $GITHUB_REF_NAME is not on main ($status); nothing is released." >&2; exit 1 ;;
          esac

      - name: Verify on Linux
        run: make verify-linux

  release:
    needs: verify-linux
    runs-on: macos-15
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Verify
        run: make verify
      # The native Keychain writer, on a throwaway keychain of this runner.
      - name: Verify the native Keychain writer
        run: build/macos/keychain-test.sh

      - name: Build plain binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # The optional "Away from home" Tailscale add-on, downloaded by
          # Switcher only when a user turns it on. Its digest is built into
          # the matching Switcher binary, which trusts nothing else.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            (cd cmd/switcher-tailnet && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "../../dist/switcher-tailnet_${VERSION}_${os}_${arch}" .)
            sum=$(shasum -a 256 "dist/switcher-tailnet_${VERSION}_${os}_${arch}" | cut -d' ' -f1)
            echo "ADDON_SHA256_${os}_${arch}=${sum}" >> "$GITHUB_ENV"
            eval "ADDON_SHA256_${os}_${arch}=${sum}"
          done
          # The plain binaries: the Linux install and its updater use them,
          # tray included (switcher tray); Linux builds need no cgo.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            eval "addon=\${ADDON_SHA256_${os}_${arch}}"
            cgo=0
            if [ "$os" = darwin ]; then cgo=1; fi
            CGO_ENABLED="$cgo" GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X switcher/internal/remote.addonSHA256=${addon}" \
              -o "dist/switcher-server_${VERSION}_${os}_${arch}" .
          done
          cd dist
          for f in switcher-server_* switcher-tailnet_*; do
            shasum -a 256 "$f" | tee "$f.sha256"
          done

      - name: Build macOS app bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Switcher.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp build/macos/logos/*.svg build/macos/MenubarTemplate*.png "$APP/Contents/Resources/"
          cp THIRD_PARTY_NOTICES.md "$APP/Contents/Resources/ThirdPartyNotices.md"
          sed "s/VERSION_TOKEN/${VERSION}/g" build/macos/Info.plist > "$APP/Contents/Info.plist"
          # One app for every Mac: Apple silicon and Intel slices, back to
          # macOS 13. Without an explicit target swiftc would require the
          # runner's own macOS version.
          SLICES="build/slices"
          rm -rf "$SLICES"
          mkdir -p "$SLICES"
          for arch in arm64 amd64; do
            eval "addon=\${ADDON_SHA256_darwin_${arch}}"
            CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X switcher/internal/remote.addonSHA256=${addon}" \
              -o "$SLICES/SwitcherServer-$arch" .
          done
          lipo -create -output "$APP/Contents/MacOS/SwitcherServer" "$SLICES/SwitcherServer-arm64" "$SLICES/SwitcherServer-amd64"
          for target in arm64-apple-macos13.0 x86_64-apple-macos13.0; do
            swiftc -parse-as-library -O -target "$target" -o "$SLICES/Switcher-$target" build/macos/menubar.swift
          done
          lipo -create -output "$APP/Contents/MacOS/Switcher" "$SLICES"/Switcher-*-apple-macos13.0
          for binary in Switcher SwitcherServer; do
            archs=$(lipo -archs "$APP/Contents/MacOS/$binary")
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "$binary is not universal: $archs" >&2; exit 1 ;; esac
          done
          # Ad-hoc signing: without it Apple Silicon reports quarantined
          # builds as "damaged".
          codesign --force --deep -s - "$APP"

      - name: Package drag-to-Applications DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="build/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "build/Switcher.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname "Switcher $VERSION" -srcfolder "$STAGE" \
              -ov -format UDZO "dist/Switcher_${VERSION}.dmg" && break
            if [ "$attempt" -eq 3 ]; then
              echo "hdiutil failed after 3 attempts" >&2
              exit 1
            fi
            echo "hdiutil attempt $attempt failed; retrying in 5s"
            sleep 5
          done

      - name: Checksum DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # install.sh checks the DMG against this.
          cd dist
          shasum -a 256 "Switcher_${VERSION}.dmg" | tee "Switcher_${VERSION}.dmg.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
